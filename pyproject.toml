[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reels-autopublish"
version = "0.1.0"
description = "Preflight, Drive media hosting, Buffer scheduling, music rotation and retention for automated short-video accounts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Marcos Bentivegna Adrián" }]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
reels-autopublish = "reels_autopublish.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
